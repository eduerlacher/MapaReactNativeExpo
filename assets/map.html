<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
  <script>
    const map = new ol.Map({
      target: 'map',
      controls: [],
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([-40.3324031, -20.2845915]),zoom: 9})
    });
    const vectorSource = new ol.source.Vector();
    const vectorLayer = new ol.layer.Vector({ source: vectorSource });
    map.addLayer(vectorLayer);
    map.once('rendercomplete', function () {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'MAP_READY' }));
    });
    map.on('click', function (evt) {
      const coord = ol.proj.toLonLat(evt.coordinate);
      const clickedFeature = map.forEachFeatureAtPixel(evt.pixel, feature => feature);

      if (clickedFeature && clickedFeature.get('kind') === 'pin') {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'PIN_CLICK',
          pin: {
            id: clickedFeature.getId(),
            title: clickedFeature.get('title'),
            latitude: coord[1],
            longitude: coord[0],
          }
        }));
        return;
      }

      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: 'MAP_CLICK',
        lon: coord[0],
        lat: coord[1]
      }));
    });
    document.addEventListener('message', function (event) {
      handleRNMessage(event.data);
    });
    window.addEventListener('message', function (event) {
      handleRNMessage(event.data);
    });

    function handleRNMessage(data) {
      try {
        const msg = JSON.parse(data);

        if (msg.type === 'SET_USER_LOCATION') {
          const coord = ol.proj.fromLonLat([msg.lon, msg.lat]);

          const oldUserFeature = vectorSource.getFeatureById('user-location');
          if (oldUserFeature) {
            vectorSource.removeFeature(oldUserFeature);
          }

          const userFeature = new ol.Feature({ geometry: new ol.geom.Point(coord) });
          userFeature.setId('user-location');
          userFeature.setStyle(new ol.style.Style({
            image: new ol.style.Circle({
              radius: 8,
              fill: new ol.style.Fill({ color: '#378ADD' }),
              stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
            })
          }));
          vectorSource.addFeature(userFeature);

          map.getView().setCenter(coord);
          map.getView().setZoom(15);
        }

        if (msg.type === 'SET_PINS') {
          vectorSource.getFeatures()
            .filter(feature => feature.get('kind') === 'pin')
            .forEach(feature => vectorSource.removeFeature(feature));

          msg.pins.forEach(pin => {
            const feature = new ol.Feature({
              geometry: new ol.geom.Point(
                ol.proj.fromLonLat([pin.longitude, pin.latitude])
              ),
              kind: 'pin',
              title: pin.title,
            });
            feature.setId(pin.id);
            const pinColor = pin.id.startsWith('upa-')
              ? '#D32F2F'
              : pin.id.startsWith('ubs-')
                ? '#2E7D32'
                : '#E4572E';
            feature.setStyle(new ol.style.Style({
              image: new ol.style.Circle({
                radius: 7,
                fill: new ol.style.Fill({ color: pinColor }),
                stroke: new ol.style.Stroke({ color: '#fff', width: 2 }),
              }),
            }));
            vectorSource.addFeature(feature);
          });
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
